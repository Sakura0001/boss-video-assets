policy:
  enabled: true
  source_file: "references/target_schools.md"
  match_field: "visible_education_schools"
  require_any_education_school_match: true
  graduation_year: 2027
  allowed_degrees:
    - "本科"
    - "研究生"
    - "硕士"
    - "博士"
  major_mode: "semantic_related_allowlist"
  allowed_majors:
    - "计算机科学与技术"
    - "大数据"
    - "电子信息"
    - "计算机技术"
    - "计算机科学"
    - "人工智能"
    - "软件工程"
    - "网络安全"
    - "新一代电子信息技术"
    - "信息工程"
    - "信息安全"
    - "信息与通信工程"
    - "自动化"
  automation_major_mode: "canonical_or_explicit_alias"
  major_aliases:
    "计算机类": "计算机科学与技术"
    "计算机应用技术": "计算机技术"
    "计算机软件与理论": "计算机科学"
    "电子与计算机工程": "计算机科学与技术"
    "数据科学": "大数据"
    "智能科学与技术": "人工智能"
    "模式识别与智能系统": "人工智能"
    "控制工程": "自动化"
    "控制科学与工程": "自动化"
    "网络空间安全": "网络安全"
    "网络工程": "计算机技术"
    "通信工程": "信息与通信工程"
    "通信与信息系统": "信息与通信工程"
    "信号与信息处理": "信息与通信工程"
    "软件技术": "软件工程"
    "物联网工程": "计算机技术"
  require_technical_experience: false
  unknown_profile_action: "no_reply"
  unmatched_profile_action: "no_reply"

privacy:
  expose_filter_reason_to_candidate: false
  save_profile_to_git: false

rules:
  - "先移除求职期望中的全部空白并转为小写，再对固定硬编码列表做子串匹配；固定列表仅为九项：算法、通信、硬件、前端、unity、电气、数据、产品、分析。命中时内部原因 `expectation_blocked`，不回复、不打招呼、不发送后续三条消息，完整求职期望不得写入本地状态或 Git。为空或未命中时，继续毕业年份、学历、学校、专业和去重门槛。"
  - "读取页面右侧显示的全部教育经历学校；本科通常一所，硕士或博士可能显示多所，只要其中任意一所命中目标名单即可通过学校门槛。"
  - "目标学校全称或批准别名必须作为独立字段完整命中；更长院校名称仅包含目标学校文字时不得通过，例如吉林大学交通学院不得按吉林大学命中。"
  - "专业名称不要求逐字命中；人工判断时，学校自定义名称只要语义上能明确判断为计算机类，或与 allowed_majors 中某一方向相近，即可通过。"
  - "确定性自动化只允许直接命中 allowed_majors，或通过 major_aliases 映射到 allowed_majors；优先直接命中，多个近义词同时命中时取文本最长者。未列入映射、明显无关或无法判断时不回复，不得由脚本自由猜测。"
  - "不要求技术经历、编程经历或工作经历，可以从零培养。"
  - "学校、学历或毕业年份不符合或无法识别时不回复；专业不符合或无法识别时默认不回复。"
  - "仅当用户明确要求本次主动打招呼不限制专业且执行器显式携带 --skip-major-filter 时，专业为空、缺失或无法识别也可继续；该例外仅适用于本次主动打招呼，不持久化，不适用于未读聊天、已有会话回复、简历评估或后续运行，也不得绕过求职期望、2027 届、学历、学校和去重门槛。"
  - "在该例外下，可识别专业保留批准的规范名称；无法识别、为空或缺失的专业在本地运行状态中写入空字符串，不保存原始专业文本。"
